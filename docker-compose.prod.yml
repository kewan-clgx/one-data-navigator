# Production overlay for a single VM (see docs/deploy_gcp_vm.md):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Differences from local: real Google OIDC and GCS (VM service account), Caddy TLS on 80/443 as the only
# public entry point, no source mounts or reload, no mock IdP/GCS. Secrets come from the VM's .env
# (template: deploy/.env.prod.example) and each service gets only the variables it needs.
# Requires Docker Compose >= 2.24 for !reset.
name: one-data-navigator

x-prod-backend-env: &prod-backend-env
  ODN_ENV: prod
  ODN_DATABASE_URL: postgresql://odn_app:${ODN_APP_DB_PASSWORD:?set in .env}@postgres:5432/odn
  # Workspace bucket via the VM service account (metadata server); no key files.
  STORAGE_EMULATOR_HOST: ""
  GOOGLE_APPLICATION_CREDENTIALS: ""
  GOOGLE_CLOUD_PROJECT: ""
  ODN_GCS_BUCKET: ${ODN_GCS_BUCKET:?set in .env}
  ODN_GCS_PREFIX: ${ODN_GCS_PREFIX:-odn}
  ODN_GCS_CREDENTIALS_FILE: ""
  # Google sign-in: ID tokens (aud = OAuth client id); hd = Workspace domain mapped to a tenant.
  ODN_OIDC_ISSUER: https://accounts.google.com
  ODN_OIDC_JWKS_URL: https://www.googleapis.com/oauth2/v3/certs
  ODN_OIDC_AUDIENCE: ${ODN_OIDC_CLIENT_ID:?set in .env}
  ODN_OIDC_TENANT_CLAIM: hd
  ODN_OIDC_DEFAULT_TENANT_EMAILS: ${ODN_OIDC_DEFAULT_TENANT_EMAILS:-}
  # Password sign-in tenants (Google Identity Platform); empty = disabled. Admin calls use the VM service account.
  ODN_IDP_PROJECT: ${ODN_IDP_PROJECT:-}
  ODN_IDP_API_KEY: ${ODN_IDP_API_KEY:-}
  # Branded invite/reset emails via Resend (key in Secret Manager); empty = Identity Platform's own emails.
  ODN_PUBLIC_URL: https://${ODN_HOSTNAME:?set in .env}
  ODN_RESEND_API_KEY_SECRET: ${ODN_RESEND_API_KEY_SECRET:-}
  ODN_MAIL_FROM: ${ODN_MAIL_FROM:-QueryMuse <noreply@querymuse.ai>}
  ODN_WORKER_TOKEN: ${ODN_WORKER_TOKEN:?set in .env}
  ODN_AGENT_TOKEN: ${ODN_AGENT_TOKEN:?set in .env}

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${ODN_DB_OWNER_PASSWORD:?set in .env}
      ODN_APP_DB_PASSWORD: ${ODN_APP_DB_PASSWORD:?set in .env}
      ODN_AGENT_DB_PASSWORD: ${ODN_AGENT_DB_PASSWORD:?set in .env}
    # Applied by docker/postgres/init/90-prod-passwords.sh on first init.
    ports: !reset []

  # Local-only emulators: never started in prod.
  gcs:
    profiles: ["local-only"]
  oidc:
    profiles: ["local-only"]

  api:
    restart: unless-stopped
    env_file: !reset []
    command:
      - sh
      - -c
      - python -m odn.db.migrate && exec uvicorn odn.api.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *prod-backend-env
      ODN_MIGRATIONS_DATABASE_URL: postgresql://odn:${ODN_DB_OWNER_PASSWORD:?set in .env}@postgres:5432/odn
      # Encrypts user-supplied connection and LLM keys; back it up (losing it makes them unreadable).
      ODN_SECRETS_KEY: ${ODN_SECRETS_KEY:?set in .env}
      ODN_LLM_DAILY_TOKEN_BUDGET: ${ODN_LLM_DAILY_TOKEN_BUDGET:-2000000}
      ODN_LLM_TRIAL_USER_DAILY_TOKENS: ${ODN_LLM_TRIAL_USER_DAILY_TOKENS:-200000}
    volumes: !reset []
    ports: !reset []
    depends_on: !override
      postgres:
        condition: service_healthy
      worker:
        condition: service_started

  agent:
    restart: unless-stopped
    env_file: !reset []
    command: ["uvicorn", "odn.agent.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *prod-backend-env
      ODN_DATABASE_URL: ""
      ODN_AGENT_SESSION_DB_URL: postgresql+psycopg://odn_agent:${ODN_AGENT_DB_PASSWORD:?set in .env}@postgres:5432/odn?options=-csearch_path%3Dadk
      LITELLM_MODEL: ${LITELLM_MODEL:?set in .env}
      LITELLM_API_KEY: ${LITELLM_API_KEY:?set in .env}
      LITELLM_API_BASE: ${LITELLM_API_BASE:-}
    volumes: !reset []
    ports: !reset []

  worker:
    restart: unless-stopped
    command: ["uvicorn", "odn.worker.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ODN_ENV: prod
      STORAGE_EMULATOR_HOST: ""
      ODN_GCS_BUCKET: ${ODN_GCS_BUCKET:?set in .env}
      ODN_GCS_PREFIX: ${ODN_GCS_PREFIX:-odn}
      ODN_GCS_CREDENTIALS_FILE: ""
      ODN_WORKER_TOKEN: ${ODN_WORKER_TOKEN:?set in .env}
    volumes: !reset []
    depends_on: !reset []

  frontend:
    # Separate tag so the prod build never replaces the local dev image.
    image: one-data-navigator-frontend:prod
    build:
      target: prod
    restart: unless-stopped
    environment:
      ODN_ENV: prod
      ODN_PUBLIC_URL: https://${ODN_HOSTNAME:?set in .env}
      ODN_OIDC_ISSUER: https://accounts.google.com
      ODN_OIDC_PUBLIC_ISSUER: ""
      ODN_OIDC_CLIENT_ID: ${ODN_OIDC_CLIENT_ID:?set in .env}
      ODN_OIDC_CLIENT_SECRET: ${ODN_OIDC_CLIENT_SECRET:?set in .env}
      # Google access tokens are opaque; the API verifies the ID token instead.
      ODN_OIDC_API_TOKEN: id_token
      ODN_OIDC_PROMPT: select_account
      # "offline" asks Google for a refresh token so sessions renew past the 1-hour ID token.
      ODN_OIDC_ACCESS_TYPE: ${ODN_OIDC_ACCESS_TYPE:-}
      ODN_SESSION_SECRET: ${ODN_SESSION_SECRET:?set in .env}
    volumes: !reset []
    ports: !reset []

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      ODN_HOSTNAME: ${ODN_HOSTNAME:?set in .env}
      ODN_REDIRECT_HOSTS: ${ODN_REDIRECT_HOSTS:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:?set in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
