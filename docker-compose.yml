# EasyQuery (formerly One Data Navigator) MVP: local Docker development stack.
# See docs/one_data_navigator_mvp_dev_plan.md. Local emulation of the GCP target:
#   Cloud SQL (Postgres + pgvector) -> postgres
#   GCS workspace bucket            -> gcs (fake-gcs-server)
#   OIDC SSO                        -> oidc (mock-oauth2-server)
#   Secret Manager                  -> ./keys mounted read-only (api only)
# Host ports are bound to 127.0.0.1 and offset from navigator_docker_env so both stacks can run.
name: one-data-navigator

x-backend-build: &backend-build
  context: ./backend
  secrets: [extra_ca]

x-backend-env: &backend-env
  ODN_ENV: local
  # Non-superuser, NOBYPASSRLS role so Row-Level Security is actually enforced.
  ODN_DATABASE_URL: postgresql://odn_app:odn_app_local_dev@postgres:5432/odn
  ODN_GCS_BUCKET: odn-workspace-local
  STORAGE_EMULATOR_HOST: http://gcs:4443
  # Tokens are always minted via the in-network URL, so this is the issuer everywhere server-side.
  ODN_OIDC_ISSUER: http://oidc:8080/odn
  ODN_OIDC_JWKS_URL: http://oidc:8080/odn/jwks
  # Password sign-in tenants (Google Identity Platform); empty = disabled.
  ODN_IDP_PROJECT: ${ODN_IDP_PROJECT:-}
  ODN_IDP_API_KEY: ${ODN_IDP_API_KEY:-}
  # Tenant slug personal email/password accounts sign up into (needs --join domain, no domains, an IdP tenant).
  ODN_PERSONAL_TENANT: ${ODN_PERSONAL_TENANT:-}
  # Live-demo tenant slug (provision demo <slug>): "Start a live demo" check-in; empty = no demo.
  ODN_DEMO_TENANT: ${ODN_DEMO_TENANT:-}
  # Live demo: new-visitor notifications (e.g. support@easyquery.ai), session length, how long a demo user lasts.
  ODN_DEMO_NOTIFY_EMAIL: ${ODN_DEMO_NOTIFY_EMAIL:-}
  ODN_DEMO_SESSION_HOURS: ${ODN_DEMO_SESSION_HOURS:-8}
  ODN_DEMO_ACCOUNT_DAYS: ${ODN_DEMO_ACCOUNT_DAYS:-7}
  # Branded invite/reset emails via Resend; empty key = Identity Platform's own emails.
  ODN_PUBLIC_URL: http://localhost:3100
  ODN_RESEND_API_KEY: ${ODN_RESEND_API_KEY:-}
  ODN_WORKER_URL: http://worker:8000
  ODN_AGENT_URL: http://agent:8000

services:
  oracle-egress:
    build:
      context: ./backend
      dockerfile: Dockerfile.oracle-egress
    environment:
      ODN_ORACLE_ALLOWED_ENDPOINTS: ${ODN_ORACLE_ALLOWED_ENDPOINTS:-}
      ODN_ORACLE_ALLOWED_CIDRS: ${ODN_ORACLE_ALLOWED_CIDRS:-}
    expose: ["8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      # Local-only dev credentials; owner/migration role.
      POSTGRES_USER: odn
      POSTGRES_PASSWORD: odn_local_dev
      POSTGRES_DB: odn
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5532:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odn -d odn"]
      interval: 5s
      timeout: 5s
      retries: 10

  gcs:
    image: fsouza/fake-gcs-server:1.52.2
    entrypoint: ["/bin/sh", "-c"]
    # Each directory under the filesystem root is a bucket. external-url must be reachable from
    # the other containers because resumable uploads follow it.
    command:
      - mkdir -p /storage/odn-workspace-local &&
        exec /bin/fake-gcs-server -backend filesystem -filesystem-root /storage
        -scheme http -port 4443 -external-url http://gcs:4443
    volumes:
      - gcs_data:/storage
    ports:
      - "127.0.0.1:4443:4443"

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "8080"
      # Local dev identity: tenant "local" (seeded by the api on start), audience "odn".
      # The issuer in tokens follows the request host; server-side calls use http://oidc:8080/odn.
      JSON_CONFIG: >-
        {"interactiveLogin": false,
         "tokenCallbacks": [{"issuerId": "odn", "tokenExpiry": 3600,
           "requestMappings": [{"requestParam": "grant_type", "match": "*",
             "claims": {"sub": "dev-user", "aud": ["odn", "odn-web"], "azp": "odn-web", "tenant": "local",
                        "email": "dev@local.test", "name": "Dev User"}}]}]}
    ports:
      - "127.0.0.1:8180:8080"

  api:
    build:
      <<: *backend-build
      args:
        ODN_EXTRAS: api
    command:
      - sh
      - -c
      - python -m odn.db.migrate --seed-local &&
        exec uvicorn odn.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
      ODN_MIGRATIONS_DATABASE_URL: postgresql://odn:odn_local_dev@postgres:5432/odn
      ODN_CONFIRM_BYTES_THRESHOLD: ${ODN_CONFIRM_BYTES_THRESHOLD:-10737418240}
      ODN_WORKER_TOKEN: ${ODN_WORKER_TOKEN:-local-dev-worker-token}
      ODN_AGENT_TOKEN: ${ODN_AGENT_TOKEN:-local-dev-agent-token}
      ODN_LLM_DAILY_TOKEN_BUDGET: ${ODN_LLM_DAILY_TOKEN_BUDGET:-2000000}
      ODN_LLM_TRIAL_USER_DAILY_TOKENS: ${ODN_LLM_TRIAL_USER_DAILY_TOKENS:-200000}
      ODN_ORACLE_PROXY_HOST: oracle-egress
      ODN_ORACLE_PROXY_PORT: 8080
      # Encrypts user-supplied credentials (connection keys, LLM keys). Local default only.
      ODN_SECRETS_KEY: ${ODN_SECRETS_KEY:-N2R7fz4qBIBVzHkefFUcCe79JC-NccgQwsOUpHK8JNE}
      # BQ_SA_KEY_FILE in .env is relative to the repo root (e.g. keys/<sa>.json).
      GOOGLE_APPLICATION_CREDENTIALS: /app/${BQ_SA_KEY_FILE:-keys/missing-sa.json}
      GOOGLE_CLOUD_PROJECT: ${BQ_PROJECT_ID:-}
    volumes:
      - ./backend/src:/app/src
      - ./keys:/app/keys:ro
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      oracle-egress:
        condition: service_started
      postgres:
        condition: service_healthy
      gcs:
        condition: service_started
      oidc:
        condition: service_started
      worker:
        condition: service_started

  agent:
    build:
      <<: *backend-build
      args:
        ODN_EXTRAS: agent
    command: ["uvicorn", "odn.agent.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
      # Agent reaches data only through the API's typed tools, never the DB directly.
      ODN_DATABASE_URL: ""
      ODN_API_URL: http://api:8000
      ODN_AGENT_TOKEN: ${ODN_AGENT_TOKEN:-local-dev-agent-token}
      # Gemini keys (platform or user-supplied) are called through LiteLLM on purpose (one code path).
      ADK_SUPPRESS_GEMINI_LITELLM_WARNINGS: "true"
      # Durable chat sessions: agent-only role, confined to the "adk" schema.
      ODN_AGENT_SESSION_DB_URL: postgresql+psycopg://odn_agent:odn_agent_local_dev@postgres:5432/odn?options=-csearch_path%3Dadk
    volumes:
      - ./backend/src:/app/src
    ports:
      - "127.0.0.1:8110:8000"
    depends_on:
      - api

  # Isolated DuckDB + chart worker: no credentials, no host port, locked-down container.
  worker:
    build:
      <<: *backend-build
      args:
        ODN_EXTRAS: worker
    command: ["uvicorn", "odn.worker.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    environment:
      ODN_ENV: local
      ODN_GCS_BUCKET: odn-workspace-local
      STORAGE_EMULATOR_HOST: http://gcs:4443
      ODN_WORKER_MEMORY_LIMIT: 1536MB
      ODN_WORKER_TOKEN: ${ODN_WORKER_TOKEN:-local-dev-worker-token}
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - ./backend/src:/app/src:ro
    expose:
      - "8000"
    mem_limit: 2g
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - gcs

  frontend:
    build:
      context: ./frontend
      target: dev
    # `next dev` can be OOM-killed with exit code 0, so on-failure would not catch it.
    restart: unless-stopped
    environment:
      ODN_API_URL: http://api:8000
      ODN_AGENT_URL: http://agent:8000
      ODN_ENV: local
      ODN_PUBLIC_URL: http://localhost:3100
      ODN_DEMO_TENANT: ${ODN_DEMO_TENANT:-}
      ODN_PERSONAL_TENANT: ${ODN_PERSONAL_TENANT:-}
      ODN_OIDC_ISSUER: http://oidc:8080/odn
      ODN_OIDC_PUBLIC_ISSUER: http://localhost:8180/odn
      ODN_OIDC_CLIENT_ID: odn-web
      ODN_OIDC_CLIENT_SECRET: local-dev-only
      # 32 random bytes, base64url. Local default only; set your own in .env.
      ODN_SESSION_SECRET: ${ODN_SESSION_SECRET:-aFvY2Uq6JklszAz8Ydu4NrTOYFMRwq5gkAJFMpZ0Ct0}
      # UI theme (frontend/app/themes): brand copy + design tokens. Unknown values fall back to cotality.
      ODN_THEME: ${ODN_THEME:-cotality}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - api

  # Sample source database for connector/eval work (Phase 3). Start with: --profile targets
  sample-postgres:
    image: postgres:16-alpine
    profiles: ["targets"]
    environment:
      POSTGRES_USER: sample_admin
      POSTGRES_PASSWORD: sample_admin_local_dev
      POSTGRES_DB: sample
    volumes:
      - ./docker/sample-postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5533:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample_admin -d sample"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  gcs_data:

secrets:
  # Extra CA for local builds behind a TLS-inspecting proxy (e.g. Zscaler): put the root PEM in keys/extra-ca.pem
  # or set ODN_EXTRA_CA_FILE. Defaults to an empty file, so normal and prod builds add nothing.
  extra_ca:
    file: ${ODN_EXTRA_CA_FILE:-./keys/.gitkeep}
