[project]
name = "one-data-navigator"
version = "0.1.0"
description = "QueryMuse (querymuse.ai) MVP backend: API/BFF, agent runtime, and result workspace worker."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.6",
    "structlog>=25.5.0",
    "httpx>=0.28.1",
]

# One extra per container so each image only carries what that service needs.
[project.optional-dependencies]
api = [
    "sqlglot>=26",
    "psycopg[binary,pool]>=3.2",
    "asyncssh>=2.14.0",
    "pgvector>=0.3",
    "pyjwt[crypto]>=2.10",
    "google-cloud-bigquery>=3.38.0",
    "google-cloud-bigquery-storage>=2.27",
    "google-cloud-storage>=2.19",
    "google-cloud-secret-manager>=2.21",
    "snowflake-connector-python>=4.7.5,<5",
    "PyMySQL[rsa]>=1.2.4,<2",
    "oracledb>=26.2.0,<27",
    "pyarrow>=18",
    # XLSX uploads become workspace tables.
    "openpyxl>=3.1",
]
agent = [
    "google-adk>=1.25.0",
    "ag-ui-adk>=0.12.0,<0.13",
    # Upper bound matches KWAgent; do not lift without a supply-chain review.
    "litellm>=1.81.13,<=1.82.6",
    "pyjwt[crypto]>=2.10",
    # Durable ADK sessions (DatabaseSessionService) in Postgres.
    "sqlalchemy[asyncio]>=2,<3",
    "psycopg[binary]>=3.2",
]
worker = [
    "duckdb>=1.1",
    "pyarrow>=18",
    "google-cloud-storage>=2.19",
    "matplotlib>=3.9",
    "sqlglot>=26",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.1",
    "mypy>=1.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"
