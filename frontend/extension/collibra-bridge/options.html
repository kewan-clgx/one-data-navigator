<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>QueryMuse Collibra Bridge</title>
    <style>
      body { font: 14px -apple-system, Segoe UI, Roboto, sans-serif; margin: 16px; width: 360px; color: #1e1405; }
      h1 { font-size: 16px; margin: 0 0 8px; }
      p { color: #555; line-height: 1.4; }
      label { display: block; font-weight: 600; margin: 12px 0 4px; }
      input { width: 100%; box-sizing: border-box; padding: 6px; }
      button { margin-top: 10px; padding: 6px 12px; }
      #status { margin-top: 8px; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <h1>QueryMuse Collibra Bridge</h1>
    <p>Lets QueryMuse read your Collibra catalog using your own Collibra sign-in in this browser. Read-only.</p>
    <label for="base">Collibra address (if QueryMuse does not provide one)</label>
    <input id="base" type="url" placeholder="https://yourcompany.collibra.com" />
    <button id="save" type="button">Save</button>
    <button id="test" type="button">Test connection</button>
    <div id="status" role="status"></div>
    <pre id="details" style="white-space: pre-wrap; font-size: 12px; background: #f4f4f5; padding: 6px; display: none"></pre>
    <p>QueryMuse uses the Collibra address your admin set up. Sign in to Collibra in this browser as usual (SSO), then use QueryMuse.</p>
    <script type="module" src="options.js"></script>
  </body>
</html>
