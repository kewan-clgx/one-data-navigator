name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: odn
          POSTGRES_PASSWORD: odn_local_dev
          POSTGRES_DB: odn
        ports: ["5532:5432"]
        options: >-
          --health-cmd "pg_isready -U odn" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Runtime roles (same init script as docker compose)
        run: psql "postgresql://odn:odn_local_dev@localhost:5532/odn" -v ON_ERROR_STOP=1 -f ../docker/postgres/init/01-init.sql
      - name: Install
        run: uv sync --frozen --extra api --extra agent --extra worker
      - name: Lint (packages that are clean today; widen as the rest is fixed)
        run: >-
          uv run ruff check src/odn/tenancy src/odn/api src/odn/db src/odn/agent src/odn/worker src/odn/platform/collibra src/odn/config.py
          src/odn/platform/identity_platform.py src/odn/platform/workspace src/odn/platform/connectors/postgres.py
          tests/tenancy tests/db tests/policy tests/workspace tests/agent tests/worker
      # Includes the adversarial SQL policy suite, RLS isolation + "every table forces RLS" guard,
      # tenant directory / sign-in rules and the admin API, against the real Postgres service.
      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit -p .
